{% extends "main.html" %}

{% block custom_header %}
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/lib/xterm/xterm.css') }}"/>
    <script src="{{ url_for('static', filename='dist/lib/xterm/xterm.js') }}" defer></script>
    <script src="{{ url_for('static', filename='dist/lib/xterm/xterm-addon-fit.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='dist/lib/socket.io/socket.io.min.js') }}" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/lib/slim-select/slimselect.css') }}"/>
    <script src="{{ url_for('static', filename='dist/lib/slim-select/slimselect.js') }}" defer></script>
    {% assets "container_terminal_js" %}
        <script src="{{ ASSET_URL }}" defer></script>
    {% endassets %}
    {% assets "container_terminal_css" %}
        <link rel="stylesheet" type="text/css" href="{{ ASSET_URL }}">
    {% endassets %}
{% endblock %}

{% block content %}
<div id="terminal-settings-modal" class="modal" style="display: none;">
    <div class="modal-content terminal-modal-content">
        <h2 id="modalQuestion">Terminal Settings</h2>
        <form id="start-form" class="terminal-settings-form">
            <div class="form-group">
                <label>Command</label>
                <select name="command" id="command-select">
                    <option value="/bin/bash">/bin/bash</option>
                    <option value="/bin/sh">/bin/sh</option>
                </select>
            </div>
            <div class="form-group">
                <label>Custom command</label>
                <input type="text" id="command-input" name="command" placeholder="e.g. /bin/zsh">
            </div>
            <div class="form-group">
                <label>User</label>
                <input type="text" id="user-field" name="user" placeholder="Default">
            </div>
            <div class="form-group">
                <label>Flags</label>
                <div class="flags-container">
                    <div class="flag-item">
                        <span>Interactive</span>
                        <input type="checkbox" id="interactive-flag" name="interactive" checked>
                        <label for="interactive-flag"></label>
                    </div>
                    <div class="flag-item">
                        <span>TTY</span>
                        <input type="checkbox" id="tty-flag" name="tty" checked>
                        <label for="tty-flag"></label>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <a href="{{ url_for('main.container.info', id=container_id) }}" class="btn cancel cancel-btn">Cancel</a>
                <input class="btn confirm" id="submit-btn" type="submit" data-container-id="{{ container_id }}" value="Exec">
            </div>
        </form>
    </div>
</div>

<div class="content-box terminal-main-box">
    <div class="terminal-wrapper" id="terminal-wrapper" style="display: none;">
        <div id="terminal-container"></div>
    </div>
</div>
{% endblock %}
